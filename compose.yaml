x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-for-production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DB_NAME: ${DB_NAME:-shop_db}
  DB_USER: ${DB_USER:-shop_user}
  DB_PASSWORD: ${DB_PASSWORD:-shop_password}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  RATE_LIMIT_REDIS_URL: redis://redis:6379/4
  ORDER_RATE_LIMIT_REQUESTS: ${ORDER_RATE_LIMIT_REQUESTS:-3}
  ORDER_RATE_LIMIT_WINDOW_SECONDS: ${ORDER_RATE_LIMIT_WINDOW_SECONDS:-3600}
  ORDER_RATE_LIMIT_TRUST_PROXY: ${ORDER_RATE_LIMIT_TRUST_PROXY:-false}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://shop:shop_password@rabbitmq:5672//}
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  CELERY_WORKER_ENABLE_REMOTE_CONTROL: ${CELERY_WORKER_ENABLE_REMOTE_CONTROL:-false}
  CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS: ${CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS:-true}
  ORDER_PENDING_TIMEOUT_SECONDS: ${ORDER_PENDING_TIMEOUT_SECONDS:-1800}
  ORDER_CANCELLATION_SCAN_SECONDS: ${ORDER_CANCELLATION_SCAN_SECONDS:-60}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

x-app-depends-on: &app-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-shop_db}
      POSTGRES_USER: ${DB_USER:-shop_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --reload
    expose:
      - "8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SETUP_ROLES: ${SETUP_ROLES:-true}
      COLLECT_STATIC: ${COLLECT_STATIC:-true}
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery-worker:
    build:
      context: .
    restart: unless-stopped
    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --without-mingle
      --without-gossip
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      SETUP_ROLES: "false"
      COLLECT_STATIC: "false"
    depends_on: *app-depends-on

  celery-beat:
    build:
      context: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      SETUP_ROLES: "false"
      COLLECT_STATIC: "false"
    depends_on: *app-depends-on

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  staticfiles:
